org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin's incremental cache cannot make relocatable paths between the Pub
# cache on C: and this Flutter project on D: (notably audioplayers_android).
# Compile Kotlin in-process without incremental caches for reliable Windows
# release builds across drive roots.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
